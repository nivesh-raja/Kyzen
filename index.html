
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kyzen - AI Verification</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              heading: ["Manrope", "Inter", "sans-serif"],
            },
            colors: {
              primary: "#3A6BFF",
              primarySoft: "#E3ECFF",
              navy: "#0A1A2F",
              accent: "#00D4A8",
              warning: "#FFC857",
              danger: "#FF6B6B",
              bgSoft: "#F5F7FB",
            },
            boxShadow: {
              soft: "0 18px 40px rgba(15, 23, 42, 0.12)",
              card: "0 12px 30px rgba(15, 23, 42, 0.10)",
              glow: "0 0 20px rgba(58, 107, 255, 0.3)",
            },
            borderRadius: {
              xl2: "1.25rem",
            },
            animation: {
              'fade-in': 'fadeIn 0.4s ease-out',
              'slide-up': 'slideUp 0.5s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          },
        },
      };
    </script>

    <!-- Extra theme helpers -->
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: radial-gradient(circle at top left, #e3ecff 0, #f5f7fb 40%, #fdfdff 100%);
        color: #0A1A2F;
        min-height: 100vh;
        transition: background 0.3s ease, color 0.3s ease;
      }

      body.dark {
        background: radial-gradient(circle at 50% 0%, #0f172a 0%, #020617 100%);
        color: #f8fafc;
      }
      
      .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.6);
        transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .dark .glass-panel {
        background: rgba(30, 41, 59, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(24px);
      }

      .glass-panel-dark {
        background: rgba(10, 26, 47, 0.95);
        backdrop-filter: blur(20px);
        color: white;
      }
      
      .soft-input {
        background: rgba(15, 23, 42, 0.96);
        color: #f9fafb;
        border-radius: 0.9rem;
        padding: 0.75rem 1rem;
        transition: all 0.2s ease;
        width: 100%;
        font-weight: 500;
        border: 1px solid transparent;
      }
      .soft-input::placeholder {
        color: #9ca3af;
        font-weight: 400;
      }
      .soft-input:focus {
        outline: none;
        box-shadow: 0 0 0 1px #3a6bff, 0 0 0 6px rgba(58, 107, 255, 0.25);
      }

      .dark .soft-input {
        background: rgba(2, 6, 23, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #f1f5f9;
      }
      .dark .soft-input:focus {
        border-color: #3a6bff;
        background: rgba(2, 6, 23, 0.8);
        box-shadow: 0 0 0 1px #3a6bff, 0 0 0 4px rgba(58, 107, 255, 0.15);
      }
      
      .primary-btn {
        background: linear-gradient(135deg, #3a6bff, #5b8bff);
        color: white;
        border-radius: 999px;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        box-shadow: 0 14px 30px rgba(54, 96, 255, 0.35);
        transition: transform 180ms ease, box-shadow 180ms ease;
        border: none;
        cursor: pointer;
      }
      .primary-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 20px 45px rgba(54, 96, 255, 0.4);
      }
      .primary-btn:active {
        transform: translateY(0px) scale(0.98);
        box-shadow: 0 9px 20px rgba(54, 96, 255, 0.35);
      }
      .primary-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .status-pill {
        border-radius: 999px;
        font-size: 0.75rem;
        padding: 0.25rem 0.75rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }
    </style>
    
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
        "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
        "vite": "https://aistudiocdn.com/vite@^7.2.4"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
